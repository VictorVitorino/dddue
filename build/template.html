<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT M&amp;A 2027</title>
<meta name="description" content="Revisão estratégica do portfólio de IT M&A e Due Diligence da Alvarez & Marsal Brasil (Digital & Technology Services): desafios, riscos, mercado, portfólio renovado com IA e capacidades para 2027.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002B4A;--navy2:#002447;--blue:#3785B8;--steel:#5E8AB4;--sky:#9DBBD9;--gold:#D3870F;--orange:#F78C16;--green:#33556D;--purple:#1F3263;--red:#BC0404;--grey:#D9D9D9;
  --ice:#DFE8F0;--ice2:#EEF3F8;--ink:#002B4A;--ink2:#35516A;--muted:#6B7B8C;--line:#D6DEE6;--line2:#E8EDF2;--paper:#fff;
  --keep:#33556D;--improve:#3785B8;--create:#D3870F;
  --fh:"Barlow Condensed","Arial Narrow",sans-serif;--fb:"Inter","Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
html,body{height:100%;background:#07131F;color:var(--ink);font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%);transform-origin:center;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.5);overflow:hidden}
.slide{position:absolute;inset:0;display:none;background:#fff}
.slide.active{display:block}
.slide.entering{animation:sIn .55s var(--ease) both}
@keyframes sIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
.slide.back.entering{animation-name:sInB}@keyframes sInB{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
[data-a]{opacity:0}
.play [data-a]{animation:.75s var(--ease) both;animation-delay:calc(var(--d,0)*80ms + 120ms)}
.play [data-a=up]{animation-name:aUp}.play [data-a=fade]{animation-name:aF}.play [data-a=zoom]{animation-name:aZ}.play [data-a=left]{animation-name:aL}.play [data-a=grow]{animation-name:aG;transform-origin:left}
.play [data-a=blur]{animation-name:aBl}.play [data-a=pop]{animation-name:aPop;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}.play [data-a=right]{animation-name:aR}.play [data-a=down]{animation-name:aDn}
@keyframes aUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes aF{from{opacity:0}to{opacity:1}}@keyframes aZ{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}@keyframes aL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}@keyframes aG{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes aBl{from{opacity:0;filter:blur(14px);transform:scale(1.05)}to{opacity:1;filter:none;transform:none}}@keyframes aPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}@keyframes aR{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}@keyframes aDn{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:6 7;animation:fl 1.1s linear infinite}@keyframes fl{to{stroke-dashoffset:-26}}
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.08);opacity:.8}}
.dr{stroke-dasharray:1 1;stroke-dashoffset:1}
.play .dr{animation:drw var(--dur,1.3s) var(--ease) both;animation-delay:calc(var(--d,0)*70ms + 250ms)}
@keyframes drw{to{stroke-dashoffset:0}}
.kw{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .1em;margin-bottom:-.1em}
.kw>span{display:inline-block;transform:translateY(108%)}
.play .kw>span{animation:kUp .75s var(--ease) both;animation-delay:calc(var(--k,0)*45ms + 160ms)}
@keyframes kUp{to{transform:none}}
@media (prefers-reduced-motion:reduce){[data-a]{opacity:1!important;animation:none!important}.slide.entering{animation:none}.flow,.pulse{animation:none}.kw>span{transform:none}}

/* ===== CHROME A&M ===== */
.slide{background-color:#F5F8FB;background-image:linear-gradient(#E9EFF4 1px,transparent 1px),linear-gradient(90deg,#E9EFF4 1px,transparent 1px);background-size:40px 40px}
.sr-top{position:absolute;left:24px;right:24px;top:16px;height:80px;background:linear-gradient(100deg,#002B4A 0%,#0B2A52 60%,#1F3263 100%);border-radius:14px;display:flex;align-items:center;gap:16px;padding:0 24px;color:#fff;z-index:3;overflow:hidden}
.am-deco{position:absolute;right:0;top:0;height:100%;width:520px;pointer-events:none;opacity:.55}
.am-wm{display:flex;align-items:center;gap:12px;position:relative}
.am-wm .am-logo{width:52px;height:46px;flex:none}
.am-wm .t{display:flex;flex-direction:column;line-height:1.1}
.am-a{font:600 19px Arial,var(--fb);font-variant:small-caps;letter-spacing:.05em;color:#fff;white-space:nowrap}
.am-s{font:500 11px var(--fb);color:#9DBBD9;letter-spacing:.08em;margin-top:3px;text-transform:uppercase}
.am-div{width:1px;height:44px;background:rgba(255,255,255,.28)}
.am-title{display:flex;flex-direction:column;line-height:1.15;position:relative}
.am-title b{font:800 18px var(--fb)}.am-title span{font:400 13px var(--fb);color:#CFE2F0}
.am-right{margin-left:auto;display:flex;align-items:center;gap:10px;font:500 12.5px var(--fb);color:#DDE6F0;position:relative;white-space:nowrap}
.am-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(211,135,15,.2)}
.am-chip{font:800 11px var(--fb);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:5px 9px;color:#fff}
.sr-dec{position:absolute;top:2px;right:26px;font:10px/1 var(--fb);letter-spacing:5px;color:#3785B8;z-index:4}
.sr-band{position:absolute;left:24px;right:24px;top:106px;height:50px;border-radius:14px 14px 0 0;display:flex;align-items:center;gap:10px;padding:0 24px;font:700 24px var(--fh);color:#fff;letter-spacing:.03em;text-transform:uppercase;z-index:2}
.sr-band small{margin-left:auto;font:500 13px var(--fb);text-transform:none;letter-spacing:0;opacity:.92}
.c-navy{background:linear-gradient(90deg,#002B4A,#0E4067 60%,#1B5A8A)}.c-green{background:linear-gradient(90deg,#33556D,#3D6480 60%,#5E8AB4)}
.c-blue{background:linear-gradient(90deg,#1F3263,#3785B8 70%,#5E8AB4)}.c-gold{background:linear-gradient(90deg,#9C6208,#D3870F 60%,#F0A33A)}
.c-steel{background:linear-gradient(90deg,#34628C,#5E8AB4 70%,#85A9CB)}.c-purple{background:linear-gradient(90deg,#122143,#1F3263 50%,#33556D)}
.c-red{background:linear-gradient(90deg,#860202,#BC0404 70%,#D8453A)}
.body{position:absolute;left:24px;right:24px;top:156px;bottom:40px;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:14px 22px;background:rgba(255,255,255,.96);overflow:hidden}
.body.dk{background:radial-gradient(900px 600px at 70% 20%,#1F3263 0%,#122143 55%,#0E1C39 100%);border-color:#1F3263;color:#DDEAF5}
.body.dk .small{color:#9DB7CE}
.foot{position:absolute;left:32px;right:32px;bottom:11px;display:flex;gap:16px;font-size:11px;color:var(--muted);align-items:center}
.foot b{color:var(--navy);letter-spacing:.06em}.foot .n{margin-left:auto;font-weight:700;color:var(--navy)}
.foot .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1100px}
.foot .s b{letter-spacing:0}
.dark{background:radial-gradient(1100px 700px at 78% 28%,#1F3263 0%,#122143 40%,var(--navy) 75%);color:#fff;background-image:none}
.slide.dark{background-image:radial-gradient(1100px 700px at 78% 28%,#1F3263 0%,#122143 40%,#002B4A 75%)}

/* ===== COMPONENTS ===== */
.stmt{font:700 27px/1.15 var(--fh);color:var(--navy);letter-spacing:.005em}.stmt em{font-style:normal;color:var(--blue)}
.dk .stmt{color:#fff}.dk .stmt em{color:#9DBBD9}
.eye{font:700 11px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.ttl{font:800 16px var(--fh);letter-spacing:.04em;text-transform:uppercase}
.small{font-size:11px;color:var(--muted);line-height:1.4}
.big{font:700 59px/.95 var(--fh);color:var(--navy)}.big small{font-size:23px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card.soft{background:var(--ice2);border-color:var(--line2)}
.card.nv{background:var(--navy);border-color:var(--navy);color:#fff}
.card h3{font:700 20px/1.1 var(--fh);color:var(--navy);margin-bottom:6px}.card.nv h3{color:#fff}
.card h4{font:700 13.5px/1.3 var(--fb);color:var(--navy);margin-bottom:4px}
.card p,.card li{font-size:12.5px;line-height:1.45;color:var(--ink2)}.card.nv p,.card.nv li{color:#C8DBEB}
.card ul{padding-left:16px}.card li+li{margin-top:3px}
.pill{display:inline-block;font:600 11.5px/1 var(--fb);padding:6px 10px;border-radius:99px;background:var(--ice);color:var(--navy)}
.tagx{display:inline-block;font:700 10px var(--fb);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:2px;color:#fff;background:var(--steel)}
.tagk{display:inline-block;font:800 10px var(--fb);letter-spacing:.12em;text-transform:uppercase;border-radius:4px;padding:4px 7px}
.hint{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:#FEF3E2;border:1px dashed #E9B36A;padding:5px 10px;border-radius:99px}
.hint::before{content:"👆"}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:7px 14px;font:700 12px var(--fb)}
.chip b{font:800 19px var(--fh)}
.ins{background:#EEF3F8;border:1.5px solid #BFD0E1;border-radius:12px;padding:14px 18px}
.ins h3{font:800 20px var(--fh);color:#33556D;letter-spacing:.03em;margin-bottom:6px}
.ins li{font-size:12.5px;line-height:1.45;color:var(--ink2);margin-left:16px}.ins li+li{margin-top:6px}.ins li b{color:#33556D}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font:700 10.5px var(--fb);letter-spacing:.1em;text-transform:uppercase;background:var(--navy);color:#fff;text-align:left;padding:8px 10px}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line2);color:var(--ink2);vertical-align:top;line-height:1.38}
.tbl td b{color:var(--navy)}
.tbl tr:nth-child(even) td{background:#F8FAFC}
.kt{border:1.5px solid #D5DEE7;border-radius:10px;background:#fff;padding:12px 16px;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center}
.kt .ic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center}
.kt .ic svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kt .tt{font:500 14px var(--fb);color:var(--navy);border-bottom:1px solid var(--line2);padding-bottom:4px}
.kt .vr{display:flex;align-items:flex-end;justify-content:space-between;margin-top:2px;gap:8px}
.kt .v{font:800 40px/1 var(--fh);letter-spacing:-.01em}
.kt .mt{font:600 10.5px var(--fb);color:var(--ink2);line-height:1.3;text-align:right}
/* evidence badges */
.ev{display:inline-flex;align-items:center;gap:5px;font:800 9.5px var(--fb);letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:3px 6px;white-space:nowrap;vertical-align:middle}
.ev-e{background:#E3EEF7;color:#1B5A8A;border:1px solid #BFD6EA}.ev-h{background:#FEF3E2;color:#9C6208;border:1px solid #F0CF9A}.ev-am{background:#E9EFF2;color:#33556D;border:1px solid #C9D6DE}
.ev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
/* status tags for portfolio */
.st{display:inline-block;font:800 10px var(--fb);letter-spacing:.12em;text-transform:uppercase;border-radius:4px;padding:4px 8px;color:#fff}
.st-keep{background:var(--keep)}.st-improve{background:var(--improve)}.st-create{background:var(--create)}
/* FDII strip: Fato → Dado → Insight → Implicação */
.fdii{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fdii>div{padding:11px 14px;position:relative;font-size:12px;line-height:1.42;color:var(--ink2);background:#fff}
.fdii>div+div{border-left:1px solid var(--line)}
.fdii .k{display:block;font:700 10px var(--fb);letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.fdii .f .k{color:var(--navy)}.fdii .d .k{color:var(--blue)}.fdii .i .k{color:var(--gold)}.fdii .m .k{color:var(--green)}
.fdii .m{background:#EEF3F8}
.fdii b{color:var(--navy)}
/* level bars */
.lv{position:relative;height:12px;border-radius:99px;background:#E6ECF1;overflow:visible}
.lv .fl{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width 1.1s var(--ease)}
/* interactive */
.clk{cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.clk:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,43,73,.14)}
.clk.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(55,133,184,.25)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 14px;font:600 12px var(--fb);color:var(--ink2)}
.seg button.on{background:var(--navy);color:#fff}
.tabs{display:flex;gap:8px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font:700 15px var(--fh);color:var(--navy);text-align:left}
.tabs button small{display:block;font:500 11px var(--fb);color:var(--muted)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.tabs button.on small{color:#9DB7CE}
.pane{display:none}.pane.on{display:block;animation:aF .4s both}
.xp .xp-body{max-height:0;overflow:hidden;transition:max-height .45s var(--ease)}.xp.open .xp-body{max-height:400px}
.rp{position:absolute;border-radius:50%;background:rgba(55,133,184,.25);transform:scale(0);animation:rp .65s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
svg text{font-family:var(--fb)}
.pbtn{display:inline-block;border-radius:8px;padding:7px 18px;font:800 15px var(--fh);letter-spacing:.05em;color:#fff;text-transform:uppercase}
.backlink{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--blue);background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}
.backlink:hover{background:var(--ice2)}
/* product one-page cards */
.pcard{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px 10px;display:flex;flex-direction:column;gap:5px;position:relative;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;min-height:0}
.pcard:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,43,73,.16);border-color:var(--blue)}
.pcard .pn{font:800 15px/1.1 var(--fh);color:var(--navy)}
.pcard .pd{font:500 11px/1.35 var(--fb);color:var(--ink2)}
.pcard .pf{display:flex;align-items:center;gap:6px;margin-top:auto;font:700 10px var(--fb);color:var(--blue);letter-spacing:.06em;text-transform:uppercase}
.pcard .num{position:absolute;right:10px;top:8px;font:800 22px var(--fh);color:#D7E0E8}
.pcard.keep{border-top:5px solid var(--keep)}.pcard.improve{border-top:5px solid var(--improve)}.pcard.create{border-top:5px solid var(--create)}
/* detail page blocks */
.dblk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;display:flex;flex-direction:column;gap:4px}
.dblk .dh{display:flex;align-items:center;gap:8px;font:800 12.5px var(--fh);letter-spacing:.06em;text-transform:uppercase;color:var(--navy);border-bottom:1px solid var(--line2);padding-bottom:5px;margin-bottom:3px}
.dblk .dh i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;color:#fff;font:800 11px var(--fb);font-style:normal}
.dblk li{font-size:11.5px;line-height:1.4;color:var(--ink2);margin-left:14px}.dblk li+li{margin-top:2px}.dblk li b{color:var(--navy)}
.dblk p{font-size:11.5px;line-height:1.4;color:var(--ink2)}
/* ===== UI ===== */
#progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--gold));z-index:50;transition:width .5s var(--ease)}
#controls{position:fixed;right:20px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:8px;align-items:center}
#controls button{border:0;border-radius:3px;height:44px;padding:0 16px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#controls .g{background:rgba(255,255,255,.93);color:var(--navy)}#controls .p{background:var(--blue);color:#fff}
#controls button:disabled{opacity:.4;cursor:not-allowed}
#controls .c{background:rgba(0,43,73,.9);color:#fff;border-radius:3px;height:44px;display:inline-flex;align-items:center;padding:0 14px;font:600 12px var(--fb)}
#controls .c.idxBtn{cursor:pointer}
#dots{position:fixed;left:20px;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:6px;flex-wrap:wrap;max-width:420px}
#dots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.3);padding:0}
#dots button.on{background:var(--gold);width:26px;border-radius:99px}
#tip{position:fixed;z-index:99;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,20,40,.25);border-radius:4px;padding:9px 12px;font:13px/1.4 var(--fb);max-width:340px;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}#tip b{display:block;font-size:14px;color:var(--navy)}#tip span{color:var(--muted);font-size:11px}
#wipe{position:absolute;inset:0;z-index:90;pointer-events:none;overflow:hidden;visibility:hidden}
#wipe i{position:absolute;top:-5%;bottom:-5%;left:-10%;width:120%;transform:translateX(-110%) skewX(-12deg)}
#wipe i:nth-child(1){background:#D3870F}#wipe i:nth-child(2){background:#3785B8}#wipe i:nth-child(3){background:#002B4A}
#chap{position:absolute;inset:0;z-index:85;display:none;background:radial-gradient(1200px 800px at 70% 30%,#1F3263 0%,#122143 40%,#0E1C39 85%);color:#fff;overflow:hidden;cursor:pointer}
#chap.on{display:block}
#chap .n{position:absolute;right:90px;top:120px;font:800 419px/.8 var(--fh);color:rgba(255,255,255,.06);letter-spacing:-.04em}
#chap .ey{position:absolute;left:120px;top:330px;font:700 15px var(--fb);letter-spacing:.3em;color:#D3870F}
#chap h1{position:absolute;left:112px;top:360px;font:800 118px/1 var(--fh);letter-spacing:-.01em;max-width:1300px}
#chap p{position:absolute;left:120px;top:512px;font:400 22px/1.4 var(--fb);color:#C8DBEB;max-width:960px}
#chap .ln{position:absolute;left:120px;top:600px;height:4px;width:0;background:linear-gradient(90deg,#D3870F,#3785B8)}
#chap .sk{position:absolute;right:40px;bottom:30px;font:600 11px var(--fb);color:#9DB7CE;letter-spacing:.1em}
#idxP{position:fixed;right:20px;bottom:70px;z-index:70;width:420px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:none}
#idxP.on{display:block}
#idxP .xh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font:800 13px var(--fb);color:var(--navy);position:sticky;top:0;background:#fff}
#idxP .ix{border:0;background:none;font-size:20px;color:var(--muted)}
#idxP .xg{font:700 10px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px}
#idxP .xi{display:grid;grid-template-columns:34px 1fr;gap:8px;width:100%;border:0;background:none;text-align:left;padding:7px 14px;font:500 13px var(--fb);color:var(--ink2);border-radius:0}
#idxP .xi:hover{background:var(--ice2)}#idxP .xi.cur{background:var(--ice);color:var(--navy);font-weight:700}
#idxP .xi b{color:var(--blue)}
#infoP{position:fixed;left:20px;bottom:70px;z-index:70;width:460px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:none;padding:14px 16px}
#infoP.on{display:block}
#infoP .ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

#rail .seg2.on{background:rgba(255,255,255,.16)}#rail .seg2.on span{color:#fff}
@media (max-width:1100px){#rail{display:none}}
@media (max-width:760px){#dots{display:none}#controls .lb{display:none}}
@media print{html,body{overflow:visible;background:#fff}#controls,#progress,#dots,#tip,#rail,#idxP,#infoP{display:none!important}#viewport{position:static}#stage{position:relative;left:auto!important;top:auto!important;transform:none!important;height:auto;box-shadow:none}.slide{position:relative;display:block!important;height:900px;break-after:page}[data-a]{opacity:1!important;animation:none!important}.pane{display:block!important}.kw>span{transform:none!important}@page{size:1600px 900px;margin:0}}

</style>

<body>
<div id="progress"></div>
<div id="viewport"><div id="stage">

</div></div>
<div id="controls"><button class="g" id="bPrev"><span style="transform:rotate(180deg);display:inline-block">➜</span><span class="lb">Voltar</span></button><span class="c" id="cnt">1 / 1</span><button class="p" id="bNext"><span class="lb">Avançar</span>➜</button></div>
<div id="dots"></div>
<div id="tip"><b></b><span></span></div>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
function S(t,a,p){const e=document.createElementNS(NS,t);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}

function T(p,x,y,s,a){const t=S("text",Object.assign({x,y},a||{}),p);t.textContent=s;return t}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* A&M mark (reproduced in SVG: diagonal + three bars + A&M) */
const AMLOGO=(h,navy,blue)=>`<svg viewBox="0 0 120 100" width="${(h||46)*1.2}" height="${h||46}" aria-label="Alvarez & Marsal"><path d="M4 100 L48 8 L62 8 L62 100 L50 100 L50 30 L18 100 Z" fill="${navy||'#fff'}"/><rect x="36" y="46" width="10" height="54" fill="${blue||'#3785B8'}"/><rect x="66" y="40" width="10" height="60" fill="${blue||'#3785B8'}"/><text x="84" y="40" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22" fill="${navy||'#fff'}">A</text><text x="84" y="64" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22" fill="${navy||'#fff'}">&amp;</text><text x="82" y="90" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22" fill="${navy||'#fff'}">M</text></svg>`;
const AMDECO=`<svg class="am-deco" viewBox="0 0 520 80" preserveAspectRatio="xMaxYMid slice" aria-hidden="true"><path d="M40 80 L100 0" stroke="#D3870F" stroke-width="1.4" fill="none"/><path d="M150 80 L210 0" stroke="#3785B8" stroke-width="7" fill="none" opacity=".55"/><path d="M190 80 V0" stroke="#D3870F" stroke-width="1.2" opacity=".7"/><path d="M280 80 L340 0" stroke="#3785B8" stroke-width="16" fill="none" opacity=".45"/><path d="M350 80 V0" stroke="#3785B8" stroke-width="5" opacity=".45"/><path d="M420 80 L480 0" stroke="#D3870F" stroke-width="1.4" fill="none" opacity=".8"/></svg>`;
/*@@DATA@@*/
/* ---------- CHROME + NAVEGAÇÃO ---------- */
const slides=[...document.querySelectorAll(".slide")],N=slides.length;let cur=0,busy=false;

function kin(el){let k=0;const walk=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType===3){const parts=c.textContent.split(/(\s+)/),f=document.createDocumentFragment();parts.forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(p));return}const w=document.createElement("span");w.className="kw";const i=document.createElement("span");i.style.setProperty("--k",k++);i.textContent=p;w.appendChild(i);f.appendChild(w)});c.replaceWith(f)}else if(c.nodeType===1&&!c.classList.contains("kw"))walk(c)})};walk(el)}
const DECK_TAG="IT M&A 2027 · Portfólio com IA";
slides.forEach((s,i)=>{if(s.dataset.band){const top=H("div",{class:"sr-top"});const p=(s.dataset.p||"").split(" · ");top.innerHTML=`${AMDECO}<div class="am-wm">${AMLOGO(44,'#fff','#3785B8')}<div class="t"><span class="am-a">Alvarez &amp; Marsal</span><span class="am-s">Digital &amp; Technology Services</span></div></div><div class="am-div"></div><div class="am-title"><b>${s.dataset.t}</b><span>${p.length>1?"Parte "+p[0]+" · "+p[1]:(p[0]||"")}</span></div><div class="am-right"><span class="am-dot"></span>${DECK_TAG}<span class="am-chip">${i+1} / ${N}</span></div>`;s.prepend(top);
s.prepend(H("div",{class:"sr-dec"},null,"▸▸▸▸▸▸▸▸▸▸▸▸"));const band=H("div",{class:"sr-band "+(s.dataset.c||"c-navy")});band.innerHTML=`<span>›</span><span class="bt">${s.dataset.band}</span>${s.dataset.bs?`<small>${s.dataset.bs}</small>`:""}`;top.after(band);kin(band.querySelector(".bt"))}
if(s.hasAttribute("data-nofoot"))return;const f=H("div",{class:"foot"},s);H("b",null,f,"A&M · DIGITAL & TECHNOLOGY SERVICES · IT M&A");if(s.dataset.src){const sp=H("span",{class:"s",title:s.dataset.src},f);sp.innerHTML="<b>Fonte: </b>"+s.dataset.src}H("span",{class:"n"},f,`${i+1} / ${N}`)});
document.querySelectorAll(".kin").forEach(kin);
slides.forEach((s,i)=>{const b=H("button",{title:s.dataset.t,"aria-label":s.dataset.t},$("dots"));b.addEventListener("click",()=>go(i))});
function fit(){const vw=innerWidth,vh=innerHeight,sm=vw<760,pad=sm?8:22,bar=sm?54:64,sc=Math.min((vw-pad*2)/1600,(vh-pad-bar)/900),st=$("stage");st.style.left=vw/2+"px";st.style.top=(pad+(vh-pad-bar)/2)+"px";st.style.transform=`translate(-50%,-50%) scale(${sc})`}
addEventListener("resize",fit);
function count(el,from,to,suf){const t0=performance.now(),d=1100;const st=t=>{const k=clamp((t-t0)/d,0,1),e=1-Math.pow(1-k,3);const v=from+(to-from)*e;el.textContent=(Number.isInteger(to)?Math.round(v):v.toFixed(1).replace(".",","))+suf;if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)}
function counters(n){n.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,suf=el.dataset.suf||"";count(el,0,to,suf)})}
const ENTER={};
function activate(i,inst,back){const n=slides[i];slides.forEach((s,k)=>{if(k!==i)s.classList.remove("active","entering","play","back")});n.classList.remove("play","entering","back");void n.offsetWidth;n.classList.add("active","play");if(!inst){n.classList.add("entering");if(back)n.classList.add("back")}cur=i;
$("cnt").textContent=`${i+1} / ${N}`;$("progress").style.width=((i+1)/N*100)+"%";$("bPrev").disabled=i===0;$("bNext").disabled=i===N-1;document.querySelectorAll("#dots button").forEach((b,k)=>b.classList.toggle("on",k===i));history.replaceState(null,"","#"+(i+1));
n.querySelectorAll(".lv .fl[data-w]").forEach(f=>{f.style.transition="none";f.style.width="0";void f.offsetWidth;f.style.transition="";setTimeout(()=>f.style.width=f.dataset.w+"%",350)});
n.querySelectorAll(".gbar").forEach(r=>{r.style.transition="none";r.setAttribute("width",0);void r.getBoundingClientRect();r.style.transition="";setTimeout(()=>r.setAttribute("width",r.dataset.w),350)});
counters(n);const fn=ENTER[n.dataset.t];if(fn)fn()}
function chapter(meta,done){const c=$("chap");c.innerHTML=`<div class="n">${meta[0]}</div><div class="ey">PARTE ${meta[0]}</div><h1>${meta[1]}</h1><p>${meta[2]}</p><div class="ln"></div><div class="sk">clique para pular ›</div>`;kin(c.querySelector("h1"));c.classList.add("on","play");
const ln=c.querySelector(".ln"),p=c.querySelector("p"),nn=c.querySelector(".n");ln.animate([{width:"0px"},{width:"520px"}],{duration:900,delay:300,easing:"cubic-bezier(.2,.7,.2,1)",fill:"forwards"});p.animate([{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],{duration:700,delay:500,fill:"backwards"});nn.animate([{opacity:0,transform:"translateX(80px)"},{opacity:1,transform:"none"}],{duration:1300,easing:"cubic-bezier(.2,.7,.2,1)"});
let ended=false;const end=()=>{if(ended)return;ended=true;c.animate([{opacity:1},{opacity:0}],{duration:450}).onfinish=()=>{c.classList.remove("on","play");c.innerHTML=""};done()};c.onclick=end;setTimeout(end,2100)}
function go(i,inst){i=Math.max(0,Math.min(N-1,i));if(i===cur&&!inst)return;if(busy)return;const back=i<cur,prevP=slides[cur].dataset.p,nextP=slides[i].dataset.p;
if(inst||REDMO){activate(i,true,back);return}
const chap=!back&&nextP!==prevP&&CH[nextP];busy=true;const w=$("wipe");w.style.visibility="visible";const bars=[...w.querySelectorAll("i")],dir=back?-1:1;
bars.forEach((b,k)=>b.animate([{transform:`translateX(${-110*dir}%) skewX(-12deg)`},{transform:"translateX(0) skewX(-12deg)"}],{duration:420,delay:k*70,easing:"cubic-bezier(.7,0,.3,1)",fill:"forwards"}));
setTimeout(()=>{const after=()=>{bars.forEach((b,k)=>b.animate([{transform:"translateX(0) skewX(-12deg)"},{transform:`translateX(${110*dir}%) skewX(-12deg)`}],{duration:460,delay:(2-k)*70,easing:"cubic-bezier(.7,0,.3,1)",fill:"forwards"}));setTimeout(()=>{w.style.visibility="hidden";busy=false},640)};
if(chap){activate(i,true,back);slides[i].classList.remove("play");chapter(chap,()=>{const n=slides[i];void n.offsetWidth;n.classList.add("play");counters(n);const fn=ENTER[n.dataset.t];if(fn)fn()});after()}else{activate(i,false,back);after()}},560)}
function goId(id){const k=slides.findIndex(s=>s.id===id);if(k>=0)go(k)}
document.addEventListener("click",e=>{const el=e.target.closest("[data-goto]");if(el){e.preventDefault();goId(el.dataset.goto)}});
$("bNext").onclick=()=>go(cur+1);$("bPrev").onclick=()=>go(cur-1);
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(cur+1)}else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1)}else if(e.key==="Home")go(0);else if(e.key==="End")go(N-1);else if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}});
let tx=null;addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});addEventListener("touchend",e=>{if(tx==null||e.target.tagName==="INPUT")return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)dx<0?go(cur+1):go(cur-1);tx=null},{passive:true});
const tp=$("tip");addEventListener("pointermove",e=>{const el=e.target.closest&&e.target.closest("[data-tv]");if(el){tp.querySelector("b").textContent=el.dataset.tv;tp.querySelector("span").textContent=el.dataset.tl;tp.classList.add("on");tp.style.left=Math.min(e.clientX+14,innerWidth-350)+"px";tp.style.top=(e.clientY+14)+"px"}else tp.classList.remove("on")});
/* ripple */
document.addEventListener("pointerdown",e=>{if(REDMO)return;const el=e.target.closest("button,.clk,.pcard");if(!el||el.id==="chap")return;if(getComputedStyle(el).position==="static")el.style.position="relative";el.style.overflow="hidden";const r=el.getBoundingClientRect(),sc=$("stage").contains(el)?$("stage").getBoundingClientRect().width/1600:1,x=(e.clientX-r.left)/sc,y=(e.clientY-r.top)/sc,size=Math.max(r.width,r.height)/sc*1.1;const sp=H("span",{class:"rp",style:`width:${size}px;height:${size}px;left:${x-size/2}px;top:${y-size/2}px`},el);setTimeout(()=>sp.remove(),650)});
/* story rail */
(function(){const parts=Object.keys(PARTS);const rail=H("div",{id:"rail"},document.body);window.RAIL=parts.map(p=>{const idx=slides.map((s,i)=>(s.dataset.p||"Contexto")===p?i:-1).filter(i=>i>=0);if(!idx.length)return null;const d=H("div",{class:"seg2"},rail);H("span",null,d,PARTS[p]);const bar=H("i",null,d);const b=H("b",null,bar);d.addEventListener("click",()=>go(idx[0]));d.title=`${PARTS[p]} · telas ${idx[0]+1}–${idx[idx.length-1]+1}`;return{idx,d,b}}).filter(Boolean)})();
function railSync(i){RAIL.forEach(r=>{const k=r.idx.indexOf(i);r.d.classList.toggle("on",k>=0);r.b.style.width=k<0?(i>r.idx[r.idx.length-1]?"100%":"0%"):((k+1)/r.idx.length*100)+"%"})}
const _act=activate;activate=function(i,inst,back){_act(i,inst,back);railSync(i)};
/* índice */
(function(){const c=$("cnt");c.setAttribute("role","button");c.setAttribute("tabindex","0");c.title="Índice · escolha a página (tecla G)";c.classList.add("idxBtn");
const ix=H("div",{id:"idxP"},document.body);const hd=H("div",{class:"xh"},ix);H("span",null,hd,"Índice");const xb=H("button",{class:"ix","aria-label":"Fechar"},hd,"×");const ls=H("div",{class:"xl"},ix);
let last=null,items=[];slides.forEach((s,i)=>{const p=s.dataset.p||"Contexto";if(p!==last){H("div",{class:"xg"},ls,PARTS[p]||p);last=p}const b=H("button",{class:"xi"},ls);H("b",null,b,String(i+1).padStart(2,"0"));H("span",null,b,s.dataset.t);b.addEventListener("click",()=>{set(false);go(i)});items.push(b)});
let open=false;const set=v=>{open=v;ix.classList.toggle("on",v);c.classList.toggle("on",v);if(v){items.forEach((b,k)=>b.classList.toggle("cur",k===cur));const a=items[cur];if(a)a.scrollIntoView({block:"center"})}};
c.addEventListener("click",e=>{e.stopPropagation();set(!open)});c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();set(!open)}});xb.addEventListener("click",()=>set(false));
ix.addEventListener("click",e=>e.stopPropagation());addEventListener("click",()=>{if(open)set(false)});addEventListener("keydown",e=>{if(e.key==="g"||e.key==="G")set(!open);if(e.key==="Escape")set(false)})})();
/* sobre este slide */
(function(){const bt=H("button",{class:"g",id:"bInfo",title:"Sobre este slide","aria-expanded":"false"});bt.innerHTML='<span style="display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid currentColor;font:800 11px/1 var(--fb)">i</span><span class="lb">Sobre este slide</span>';
$("controls").insertBefore(bt,$("bPrev"));
const pn=H("div",{id:"infoP"},document.body);pn.innerHTML='<div class="ih"><span class="ie">Sobre este slide</span><button class="ix" aria-label="Fechar">×</button></div><div class="it"></div><div class="id"></div>';
let open=false;const fill=i=>{const s=slides[i];pn.querySelector(".it").textContent=s.dataset.t;pn.querySelector(".id").textContent=s.dataset.desc||"Tela da revisão estratégica do portfólio de IT M&A da A&M."};
const set=v=>{open=v;pn.classList.toggle("on",v);bt.classList.toggle("on",v);bt.setAttribute("aria-expanded",v);if(v)fill(cur)};
bt.addEventListener("click",()=>set(!open));pn.querySelector(".ix").addEventListener("click",()=>set(false));
addEventListener("keydown",e=>{if(e.key==="i"||e.key==="I")set(!open);if(e.key==="Escape")set(false)});
const _a8=activate;activate=function(i,inst,back){_a8(i,inst,back);if(open)fill(i)}})();

fit();const h0=parseInt(location.hash.slice(1),10);cur=isNaN(h0)?0:Math.max(0,Math.min(N-1,h0-1));activate(cur,true);
